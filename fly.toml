# Backend on Fly.io in Mumbai (bom): next to the Supabase database (ap-south-1) and the Vercel functions (bom1).
# See docs/DEPLOYMENT.md, "Move the backend to Mumbai".
app = "mobilenmore-api"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  API_ONLY = "true"
  NODE_VERSION = "22"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"     # keep it running: no wake-up delay for customers
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "40s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
